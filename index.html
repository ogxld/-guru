<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sport Analyst</title>
    <style>
        :root { --bg: #121212; --card-bg: #1e1e1e; --accent: #00e676; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        #settings { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; border-left: 4px solid var(--accent); }
        .settings-toggle { cursor: pointer; color: var(--accent); font-weight: bold; margin-bottom: 10px; display: block; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px; background: #333; border: none; color: white; border-radius: 4px; box-sizing: border-box; }
        .match-card { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        button { background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #analysis-result { background: #252525; padding: 15px; border-radius: 8px; margin-top: 20px; white-space: pre-wrap; display: none; border: 1px solid var(--accent); line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ AI Sport Analyst</h1>
    <span class="settings-toggle" onclick="document.getElementById('settings').style.display = (document.getElementById('settings').style.display === 'block' ? 'none' : 'block')">⚙️ Ustawienia API</span>
    <div id="settings">
        <label>Gemini API Key</label>
        <input type="password" id="geminiKey" placeholder="Wklej klucz z Google AI Studio">
        <label>Football-Data API Key</label>
        <input type="password" id="sportKey" placeholder="Wklej klucz z football-data.org">
    </div>

    <input type="date" id="matchDate" onchange="fetchMatches()">
    <div id="matches-list">Wybierz datę powyżej, aby załadować mecze.</div>
    <div id="analysis-result"></div>
</div>

<script>
    async function fetchMatches() {
        const date = document.getElementById('matchDate').value;
        const key = document.getElementById('sportKey').value;
        const list = document.getElementById('matches-list');
        if (!date || !key) return alert("Uzupełnij klucze i datę!");

        list.innerHTML = 'Pobieram mecze przez proxy...';
        
        // Używamy proxy, aby ominąć CORS
        const proxyUrl = "https://corsproxy.io/?";
        const apiUrl = `https://api.football-data.org/v4/matches?dateFrom=${date}&dateTo=${date}`;

        try {
            const response = await fetch(proxyUrl + encodeURIComponent(apiUrl), {
                headers: { 'X-Auth-Token': key }
            });
            
            if (!response.ok) throw new Error("Błąd API: Sprawdź klucz lub limit zapytań.");
            
            const data = await response.json();
            list.innerHTML = '';
            
            if (data.matches.length === 0) { list.innerHTML = "Brak meczów w tym dniu."; return; }

            data.matches.forEach(m => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div><strong>${m.homeTeam.shortName} vs ${m.awayTeam.shortName}</strong><br><small>${m.competition.name}</small></div>
                    <button onclick="analyzeMatch('${m.homeTeam.name} vs ${m.awayTeam.name}', '${m.competition.name}')">Analiza AI</button>
                `;
                list.appendChild(card);
            });
        } catch (e) {
            list.innerHTML = `<span style="color:red">${e.message}</span>`;
        }
    }

    async function analyzeMatch(matchName, league) {
        const geminiKey = document.getElementById('geminiKey').value;
        const resDiv = document.getElementById('analysis-result');
        if (!geminiKey) return alert('Wpisz klucz Gemini!');
        
        resDiv.style.display = 'block';
        resDiv.innerText = 'Analizuję mecz...';

        const prompt = `Jesteś analitykiem bukmacherskim. Przeanalizuj mecz ${matchName} w ${league}. Skup się na: 1. Strzelcach goli. 2. Strzałach celnych. 3. Dynamice meczu. 4. Podaj 3 profesjonalne typy z uzasadnieniem. Pisz konkretnie, używaj punktorów.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            resDiv.innerText = data.candidates[0].content.parts[0].text;
        } catch (e) {
            resDiv.innerText = 'Błąd połączenia z Gemini. Sprawdź klucz.';
        }
    }
</script>
</body>
</html>
